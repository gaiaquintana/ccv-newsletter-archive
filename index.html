<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cultura con vos — Ediciones anteriores</title>
  <meta name="description" content="Una newsletter sobre español rioplatense, cultura argentina y Buenos Aires.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <p class="site-eyebrow">Archivo</p>
      <h1 class="site-title">Cultura con vos</h1>
      <p class="site-description">
        Explorá ediciones anteriores de mi newsletter gratuita sobre español rioplatense,
        cultura argentina y vida en Buenos Aires.
      </p>
    </div>
  </header>

  <main class="container site-main">
    <section id="newsletter-list" class="newsletter-list" aria-live="polite">
      <!-- Las tarjetas de newsletters se generan dinámicamente con script.js -->
    </section>
    <div id="load-more" class="load-more" hidden>
      <button type="button" class="load-more__button">Ver ediciones anteriores</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Cultura con vos</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
